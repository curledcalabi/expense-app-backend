<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FINORA — Personal Spending</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    :root {
      --ink: #f4eee3;
      --muted: rgba(244,238,227,.68);
      --mint: #d5b477;
      --deep: #1b1713;
      --ease: cubic-bezier(.23,1,.32,1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--deep); }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--deep); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    button, a { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--mint); outline-offset: 4px; }

    .finora-page { position: relative; min-height: 100dvh; overflow: hidden; isolation: isolate; background: var(--deep); color: var(--ink); }
    .visual-backdrop { position: fixed; inset: 0; z-index: -2; overflow: hidden; background: var(--deep); }
    .hero-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); filter: saturate(.78) contrast(1.05) brightness(.72); animation: heroZoom 1.8s var(--ease) forwards; }
    .video-tint { position: absolute; inset: 0; background: radial-gradient(circle at 77% 18%, rgba(213,180,119,.16), transparent 33%), linear-gradient(108deg, rgba(28,22,17,.82) 0%, rgba(28,22,17,.4) 47%, rgba(28,22,17,.22) 100%); }
    .reveal-layer { position: absolute; inset: 0; z-index: 1; pointer-events: none; background-position: center; background-size: cover; background-repeat: no-repeat; mix-blend-mode: screen; opacity: .9; mask-size: 100% 100%; -webkit-mask-size: 100% 100%; mask-repeat: no-repeat; -webkit-mask-repeat: no-repeat; }
    .reveal-mask-canvas { position: fixed; width: 0; height: 0; opacity: 0; pointer-events: none; }
    .bottom-blur { position: absolute; inset: 0; z-index: 2; pointer-events: none; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); mask-image: linear-gradient(to top, #000 0%, transparent 45%); -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 45%); opacity: .9; }
    .grain { position: absolute; inset: 0; z-index: 3; opacity: .12; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.34'/%3E%3C/svg%3E"); mix-blend-mode: soft-light; }

    .finora-nav { position: fixed; z-index: 100; top: 0; left: 0; right: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem; padding: 26px 48px; }
    .brand-mark, .login-button, .guide-trigger, .scroll-cue, .primary-cta, .guide-card { font: inherit; color: inherit; border: 0; cursor: pointer; }
    .brand-mark { justify-self: start; padding: 0; letter-spacing: -.085em; font-size: 1.9rem; font-weight: 750; color: #f8f1e7; background: transparent; }
    .brand-dot, .hero-period { color: var(--mint); }
    .nav-actions { justify-self: end; display: flex; align-items: center; gap: 18px; }
    .login-button { padding: 8px 0; color: rgba(244,238,227,.9); background: transparent; font-size: .75rem; font-weight: 500; transition: color .2s ease; }
    .login-button:hover { color: var(--mint); }
    .guide-trigger { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; color: var(--mint); background: rgba(255,255,255,.035); backdrop-filter: blur(13px); box-shadow: inset 0 1px 1px rgba(255,255,255,.13), 0 10px 40px rgba(0,0,0,.1); transition: transform .25s var(--ease), background .2s ease; }
    .guide-trigger:hover { transform: rotate(8deg) scale(1.06); background: rgba(213,180,119,.13); }

    .hero-section { position: relative; min-height: 100dvh; display: flex; align-items: flex-end; padding: 0 48px 74px; }
    .hero-copy { position: relative; z-index: 6; width: min(920px, 80vw); padding-top: 130px; }
    .eyebrow { display: flex; align-items: center; gap: 10px; margin: 0 0 25px; color: rgba(239,255,251,.73); font-size: .63rem; font-weight: 600; letter-spacing: .18em; }
    .eyebrow-line { width: 28px; height: 1px; background: var(--mint); box-shadow: 0 0 12px rgba(213,180,119,.8); }
    .eyebrow-separator { opacity: .38; }
    .hero-heading { max-width: 940px; margin: 0; color: #f7f0e6; font-size: clamp(4.3rem, 8.3vw, 9.4rem); font-weight: 500; letter-spacing: -.088em; line-height: .86; }
    .hero-heading-line { display: block; white-space: nowrap; }
    .heading-indent { padding-left: clamp(1.5rem, 7vw, 8rem); }
    .hero-description { max-width: 410px; margin: 30px 0 0 clamp(1.5rem, 7vw, 8rem); color: var(--muted); font-size: .88rem; font-weight: 300; line-height: 1.65; }
    .hero-actions { display: flex; align-items: center; gap: 12px; margin: 27px 0 0 clamp(1.5rem, 7vw, 8rem); }
    .primary-cta { display: inline-flex; align-items: center; justify-content: center; gap: 16px; min-height: 47px; border-radius: 999px; padding: 0 21px; color: #241b12; background: #f4eee3; box-shadow: 0 10px 30px rgba(0,0,0,.17); font-size: .69rem; font-weight: 700; letter-spacing: .08em; transition: transform .22s var(--ease), background .22s ease, color .22s ease, box-shadow .22s ease; }
    .primary-cta:hover { color: #0a1b18; background: var(--mint); transform: translateY(-2px) scale(1.02); box-shadow: 0 13px 34px rgba(213,180,119,.22); }
    .primary-cta:active { transform: scale(.97); }

    .hero-meta { position: absolute; z-index: 6; right: 48px; bottom: 78px; display: flex; flex-direction: column; align-items: flex-end; gap: 16px; color: rgba(239,255,251,.48); font-size: .57rem; font-weight: 500; letter-spacing: .16em; text-align: right; line-height: 1.5; }
    .hero-meta-rule { width: 44px; height: 1px; background: rgba(239,255,251,.42); }
    .hero-meta-index { color: var(--mint); }
    .scroll-cue { position: absolute; z-index: 6; right: 50%; bottom: 26px; display: flex; align-items: center; gap: 12px; color: rgba(239,255,251,.58); background: transparent; font-size: .57rem; font-weight: 600; letter-spacing: .16em; transform: translateX(50%); }
    .scroll-cue-line { display: block; width: 46px; height: 1px; background: var(--mint); transition: width .25s ease; }
    .scroll-cue:hover .scroll-cue-line { width: 76px; }

    .guide-section { position: absolute; z-index: 7; right: 48px; bottom: 48px; display: grid; grid-template-columns: 150px 300px; gap: 18px; align-items: end; width: auto; min-height: 0; padding: 0; }
    .guide-section .eyebrow { margin-bottom: 12px; white-space: nowrap; font-size: .5rem; letter-spacing: .13em; }
    .guide-section .eyebrow-line { width: 18px; }
    .selected-guide-info h2 { max-width: 150px; margin: 0; color: #f5ecdd; font-size: clamp(2.2rem, 3vw, 3.15rem); font-weight: 800; letter-spacing: .1em; line-height: .95; text-shadow: 0 0 20px rgba(224,193,137,.2), 0 3px 16px rgba(0,0,0,.5); }
    .selected-guide-info p { max-width: 150px; margin: 12px 0 0; color: #f5ecdd; font-size: .92rem; font-weight: 500; letter-spacing: .025em; line-height: 1.3; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
    .guide-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 300px; }
    .guide-card { position: relative; min-height: 198px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; padding: 12px; border: 1px solid rgba(255,255,255,.16); border-radius: 17px; color: var(--ink); background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.025)); text-align: left; transition: transform .35s var(--ease), background .35s ease, box-shadow .35s ease; }
    .guide-card:hover, .guide-card.is-selected { transform: translateY(-8px); background: linear-gradient(145deg, rgba(213,180,119,.15), rgba(255,255,255,.035)); box-shadow: 0 22px 60px rgba(0,0,0,.25), 0 0 0 1px rgba(213,180,119,.34); }
    .guide-card-topline, .guide-card-bottomline { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; font-size: .44rem; font-weight: 600; letter-spacing: .12em; }
    .guide-card-topline { color: rgba(239,255,251,.55); }
    .guide-card-topline span:last-child { color: var(--mint); }
    .guide-card-bottomline { align-items: flex-end; color: rgba(239,255,251,.56); }
    .guide-card-bottomline strong { color: #fff; font-size: 1rem; font-weight: 400; letter-spacing: -.06em; }
    .guide-card-bottomline span { display: flex; align-items: center; gap: 4px; font-size: .4rem; }
    .guide-art { position: absolute; inset: 27px 0 34px; display: grid; place-items: center; }
    .guide-image { position: relative; z-index: 2; width: 78%; height: 100%; object-fit: cover; border-radius: 11px; filter: saturate(.82) contrast(1.02); transition: transform .5s var(--ease), filter .35s ease; }
    .guide-card:hover .guide-image, .guide-card.is-selected .guide-image { transform: translateY(-4px) scale(1.04); filter: saturate(1) contrast(1.04); }

    .hero-anim { opacity: 0; animation-fill-mode: forwards; animation-timing-function: cubic-bezier(.16,1,.3,1); }
    .hero-reveal { animation: heroReveal 1.1s; animation-fill-mode: forwards; }
    .hero-fade { animation: heroFadeUp 1s; animation-fill-mode: forwards; }
    @keyframes heroReveal { 0% { opacity: 0; transform: translateY(40px); filter: blur(20px); } 100% { opacity: 1; transform: translateY(0); filter: blur(0); } }
    @keyframes heroFadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes heroZoom { 0% { transform: scale(1.12); } 100% { transform: scale(1.04); } }

    @media (max-width: 1100px) {
      .finora-nav, .hero-section { padding-left: 30px; padding-right: 30px; }
      .hero-heading { font-size: clamp(4rem, 8.8vw, 7rem); }
      .hero-meta { right: 30px; }
      .guide-section { right: 30px; grid-template-columns: 120px 260px; gap: 12px; }
      .guide-grid { width: 260px; }
    }
    @media (max-width: 820px) {
      .finora-nav { padding: 22px 20px; }
      .login-button, .guide-trigger { display: none; }
      .hero-section { min-height: 100svh; align-items: flex-end; padding: 0 20px 86px; }
      .hero-copy { width: 100%; padding-top: 110px; }
      .hero-heading { font-size: clamp(3.4rem, 14vw, 6rem); line-height: .89; }
      .hero-heading-line { white-space: normal; }
      .heading-indent { padding-left: 1.35rem; }
      .hero-description { max-width: 330px; margin-top: 24px; margin-left: 1.35rem; font-size: .78rem; }
      .hero-actions { margin-left: 1.35rem; }
      .hero-meta { display: none; }
      .guide-section { left: 20px; right: 20px; bottom: 22px; grid-template-columns: 105px 1fr; gap: 10px; align-items: end; }
      .selected-guide-info h2 { font-size: 2rem; }
      .selected-guide-info p { font-size: .7rem; margin-top: 8px; }
      .guide-grid { width: 100%; gap: 7px; }
      .guide-card { min-height: 126px; padding: 9px; border-radius: 13px; }
      .guide-card-bottomline strong { font-size: .82rem; }
      .guide-card-bottomline span { font-size: .31rem; }
      .guide-art { inset: 20px 0 26px; }
      .scroll-cue { bottom: 10px; font-size: .48rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>

      };

      document.querySelectorAll('[data-login]').forEach((button) => {
        button.addEventListener('click', () => { window.location.assign(LOGIN_URL); });
      });

      document.getElementById('brandButton').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
      document.getElementById('guideTrigger').addEventListener('click', () => document.getElementById('guide-selection').scrollIntoView({ behavior: 'smooth', block: 'center' }));
      document.getElementById('scrollCue').addEventListener('click', () => document.getElementById('guide-selection').scrollIntoView({ behavior: 'smooth', block: 'center' }));

      const selectedName = document.getElementById('selectedName');
      const selectedDescription = document.getElementById('selectedDescription');
      document.querySelectorAll('[data-guide]').forEach((card) => {
        card.addEventListener('click', () => {
          const guide = card.dataset.guide;
          document.querySelectorAll('[data-guide]').forEach((item) => {
            const selected = item === card;
            item.classList.toggle('is-selected', selected);
            item.setAttribute('aria-pressed', String(selected));
            item.querySelector('.selection-label').textContent = selected ? 'SELECTED' : 'MEET';
            item.querySelector('.check').textContent = selected ? '✓' : '';
          });
          const isBoy = guide === 'boy';
          selectedName.textContent = isBoy ? 'AVER' : 'AVERI';
          selectedDescription.textContent = `Your guide is ${isBoy ? 'Aver' : 'Averi'}`;
          localStorage.setItem('finora-guide', guide);
        });
      });

      document.getElementById('boyImage').src = guideImages.boy;
      document.getElementById('girlImage').src = guideImages.girl;

      const revealLayer = document.getElementById('revealLayer');
      const revealImage = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260609_201152_bba90a12-bf12-459f-91f0-51f237dbaf3b.png&w=1280&q=85';
      revealLayer.style.backgroundImage = `url("${revealImage}")`;
      let target = { x: -999, y: -999 }, current = { x: -999, y: -999 };
      const canvas = document.createElement('canvas');
      canvas.className = 'reveal-mask-canvas';
      document.body.appendChild(canvas);
      const ctx = canvas.getContext('2d');

      function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
      function renderReveal() {
        current.x += (target.x - current.x) * .1;
        current.y += (target.y - current.y) * .1;
        resizeCanvas();
        if (current.x >= 0 && current.y >= 0) {
          const gradient = ctx.createRadialGradient(current.x, current.y, 0, current.x, current.y, 260);
          gradient.addColorStop(0, 'rgba(255,255,255,1)');
          gradient.addColorStop(.4, 'rgba(255,255,255,1)');
          gradient.addColorStop(.6, 'rgba(255,255,255,.75)');
          gradient.addColorStop(.75, 'rgba(255,255,255,.4)');
          gradient.addColorStop(.88, 'rgba(255,255,255,.12)');
          gradient.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, innerWidth, innerHeight);
          const mask = canvas.toDataURL('image/png');
          revealLayer.style.maskImage = `url(${mask})`;
          revealLayer.style.webkitMaskImage = `url(${mask})`;
        }
        requestAnimationFrame(renderReveal);
      }
      addEventListener('mousemove', (event) => { target = { x: event.clientX, y: event.clientY }; });
      addEventListener('resize', resizeCanvas);
      resizeCanvas();
      renderReveal();
    })();
  </script>
